name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test (initialize + tools/list + tools/call)
        run: |
          PORT=3777 MCP_ENABLE_JSON_RESPONSE=true node dist/index.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          until curl -sf http://localhost:3777/health > /dev/null; do sleep 1; done
          curl -sf -X POST http://localhost:3777/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q '"protocolVersion"'
          curl -sf -X POST http://localhost:3777/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | grep -q '"echo"'
          curl -sf -X POST http://localhost:3777/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"echo","arguments":{"message":"ci"}}}' \
            | grep -q '"ci"'
