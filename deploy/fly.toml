# Fly.io configuration. Rename or copy to ./fly.toml, then:
#
#   fly launch --copy-config --no-deploy
#   fly secrets set MCP_AUTH_TOKEN=$(openssl rand -hex 32)
#   fly deploy
#
# Your MCP endpoint will be: https://<app-name>.fly.dev/mcp

app = "mcp-streamable-http-template"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  MCP_STATELESS = "true"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
