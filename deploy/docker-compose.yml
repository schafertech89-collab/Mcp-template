services:
  mcp:
    build: ..
    image: mcp-streamable-http-template:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      MCP_STATELESS: "true"
      TRUST_PROXY: "true"
      # Uncomment and set a strong value in production:
      # MCP_AUTH_TOKEN: "change-me"
      # RATE_LIMIT_MAX: "60"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
